name: Open3DBroadcast Plugin Release

# A release of Open3DBroadcast from a tag open3dbroadcast-vX.Y.Z (WP-R2; mid-project review BC-4,
# BC-5; maintainer decision 2026-10-06). Details in Build/README.md, "Releases".
#   1. Release gate (GitHub-hosted, a minute): Build/Scripts/release-version.py takes X.Y.Z from
#      the tag and requires CHANGELOG.md's "## [X.Y.Z]" section, which names the protocol,
#      transport API and core versions the release carries. It then stamps VersionName X.Y.Z and
#      Version X*10000 + Y*100 + Z into both .uplugin files and uploads them for the next jobs.
#   2. Fab source zip and UE build and tests: the workflows PR CI runs
#      (open3dbroadcast-fab-package.yml, open3dbroadcast-ue-build-test.yml), on the stamped
#      files: build with warnings as errors, the automation tests alone and with the WebRTC
#      add-on (each at its floor), the strict build, and BuildPlugin on the Fab zip.
#   3. Publish (GitHub-hosted, tag pushes only, after 1 and 2 passed): the GitHub release, with the
#      package the tests ran against, as UE_<engine>/Plugins/Open3DBroadcast, and the CHANGELOG
#      section as notes. The WebRTC add-on is attached only when the repository variable
#      O3D_PUBLISH_WEBRTC_ADDON is 'true' (WP-F11, ADR 0002: it waits on counsel question L1).
#      The Fab zip is kept as a 90-day run artifact, to upload to Fab by hand; it is not attached.
#
# Run by hand (Actions > Run workflow) for a dry run: every job but Publish, on the chosen
# branch, with a missing CHANGELOG section reported as a warning. A dry run cannot create a tag
# or a release.

on:
  push:
    tags:
      - "open3dbroadcast-v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Dry run: the version X.Y.Z to build and test as (nothing is published)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: open3dbroadcast-plugin-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version from the tag and the CHANGELOG section
        id: check
        env:
          TAG: ${{ github.ref_name }}
          DRY_RUN_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            python3 Build/Scripts/release-version.py check --tag "$TAG" \
              --notes-out "$RUNNER_TEMP/notes.md" --github-output "$GITHUB_OUTPUT"
          else
            python3 Build/Scripts/release-version.py check --version "$DRY_RUN_VERSION" --allow-missing-section \
              --notes-out "$RUNNER_TEMP/notes.md" --github-output "$GITHUB_OUTPUT"
          fi

      - name: Stamp the version into both .uplugin files
        run: |
          python3 Build/Scripts/release-version.py stamp --version "${{ steps.check.outputs.version }}" \
            ProjectSandbox/Plugins/Open3DBroadcast/Open3DBroadcast.uplugin \
            ProjectSandbox/Plugins/Open3DBroadcastWebRTC/Open3DBroadcastWebRTC.uplugin

      - name: Upload the stamped .uplugin files
        uses: actions/upload-artifact@v4
        with:
          name: Open3DBroadcast-Release-Descriptors-${{ github.sha }}
          path: |
            ProjectSandbox/Plugins/Open3DBroadcast/Open3DBroadcast.uplugin
            ProjectSandbox/Plugins/Open3DBroadcastWebRTC/Open3DBroadcastWebRTC.uplugin
          if-no-files-found: error
          retention-days: 7

      - name: Upload the release notes
        uses: actions/upload-artifact@v4
        with:
          name: Open3DBroadcast-Release-Notes-${{ github.sha }}
          path: ${{ runner.temp }}/notes.md
          if-no-files-found: error
          retention-days: 7

  fab-package:
    needs: gate
    uses: ./.github/workflows/open3dbroadcast-fab-package.yml
    with:
      version: ${{ needs.gate.outputs.version }}
      uplugin-artifact: Open3DBroadcast-Release-Descriptors-${{ github.sha }}

  build-and-test:
    name: UE build and tests
    needs: [ gate, fab-package ]
    # Runs when the Fab zip failed too, so one run reports both; Publish needs both to pass.
    if: ${{ !cancelled() && needs.gate.result == 'success' }}
    uses: ./.github/workflows/open3dbroadcast-ue-build-test.yml
    with:
      fab-package-result: ${{ needs.fab-package.result }}
      version: ${{ needs.gate.outputs.version }}
      uplugin-artifact: Open3DBroadcast-Release-Descriptors-${{ github.sha }}

  publish:
    name: Publish the GitHub release
    needs: [ gate, fab-package, build-and-test ]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/open3dbroadcast-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      PUBLISH_WEBRTC_ADDON: ${{ vars.O3D_PUBLISH_WEBRTC_ADDON == 'true' && 'true' || 'false' }}
    steps:
      - name: Download the tested plugin package
        uses: actions/download-artifact@v4
        with:
          name: Open3DBroadcast-Win64-${{ github.sha }}
          path: ${{ runner.temp }}/PluginPackage

      - name: Download the WebRTC add-on
        uses: actions/download-artifact@v4
        with:
          name: Open3DBroadcastWebRTC-Win64-${{ github.sha }}
          path: ${{ runner.temp }}/AddOnPackage

      - name: Download the Fab source zip
        uses: actions/download-artifact@v4
        with:
          name: Open3DBroadcast-Fab-Source-${{ github.sha }}
          path: ${{ runner.temp }}/FabZip

      - name: Download the release notes
        uses: actions/download-artifact@v4
        with:
          name: Open3DBroadcast-Release-Notes-${{ github.sha }}
          path: ${{ runner.temp }}/Notes

      - name: Archives and notes
        id: archives
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          # The engine version comes from the package's own descriptor, and the package must carry
          # the release's version: it is what the tests ran against.
          read -r ue packaged < <(python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8-sig")); print(".".join(d["EngineVersion"].split(".")[:2]), d["VersionName"])' PluginPackage/Open3DBroadcast.uplugin)
          if [ "$packaged" != "$VERSION" ]; then
            echo "::error::The tested package has VersionName '$packaged', not '$VERSION'."
            exit 1
          fi
          plugin_zip="Open3DBroadcast-Plugin-$VERSION-Win64.zip"
          addon_zip="Open3DBroadcastWebRTC-Plugin-$VERSION-Win64.zip"
          mkdir -p "Stage/UE_$ue/Plugins" "AddOnStage/UE_$ue/Plugins"
          cp -r PluginPackage "Stage/UE_$ue/Plugins/Open3DBroadcast"
          cp -r AddOnPackage/Open3DBroadcastWebRTC "AddOnStage/UE_$ue/Plugins/Open3DBroadcastWebRTC"
          (cd Stage && zip -qr "$RUNNER_TEMP/$plugin_zip" .)
          (cd AddOnStage && zip -qr "$RUNNER_TEMP/$addon_zip" .)
          {
            cat Notes/notes.md
            echo
            echo "### Installation"
            echo
            echo "1. Download $plugin_zip."
            echo "2. Copy its \`UE_$ue/Plugins/Open3DBroadcast\` folder into your project's \`Plugins\` folder."
            echo "3. Restart Unreal Editor and enable **Open3DBroadcast**."
            echo
            echo "Unreal Engine $ue only, Windows (Win64) only. This is the GitHub build, not the Fab package."
            if [ "$PUBLISH_WEBRTC_ADDON" = "true" ]; then
              echo
              echo "WebRTC (LiveKit) is the separate add-on $addon_zip. Copy its \`UE_$ue/Plugins/Open3DBroadcastWebRTC\` folder next to Open3DBroadcast."
            fi
          } > release_notes.md
          echo "plugin_zip=$RUNNER_TEMP/$plugin_zip" >> "$GITHUB_OUTPUT"
          echo "addon_zip=$RUNNER_TEMP/$addon_zip" >> "$GITHUB_OUTPUT"

      - name: Keep the release files
        uses: actions/upload-artifact@v4
        with:
          name: Open3DBroadcast-Release-${{ needs.gate.outputs.version }}
          path: |
            ${{ steps.archives.outputs.plugin_zip }}
            ${{ steps.archives.outputs.addon_zip }}
            ${{ runner.temp }}/FabZip/*
          if-no-files-found: error
          retention-days: 90

      - name: Create the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Open3DBroadcast ${{ needs.gate.outputs.version }}
          body_path: ${{ runner.temp }}/release_notes.md
          files: |
            ${{ steps.archives.outputs.plugin_zip }}
            ${{ env.PUBLISH_WEBRTC_ADDON == 'true' && steps.archives.outputs.addon_zip || '' }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
