
name: Open3DBroadcast Plugin Release

on:
  push:
    tags:
      - "open3dbroadcast-v*.*.*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g., open3dbroadcast-v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  checks: write

concurrency:
  group: open3dbroadcast-plugin-release-${{ github.ref }}
  cancel-in-progress: true

env:
  UE_ROOT: 'C:\Program Files\Epic Games\UE_5.7'
  PLUGIN_NAME: 'Open3DBroadcast'
  PLUGIN_PATH: 'ProjectSandbox/Plugins/Open3DBroadcast'
  ADDON_NAME: 'Open3DBroadcastWebRTC'
  ADDON_PATH: 'ProjectSandbox/Plugins/Open3DBroadcastWebRTC'
  # WP-F11 / ADR 0002: the WebRTC add-on is built for every release, but attached to the GitHub
  # release only when the repository variable O3D_PUBLISH_WEBRTC_ADDON is 'true'. Publishing it
  # before the codec-free livekit_ffi rebuild waits on counsel question L1; until then it is a
  # workflow artifact only.
  PUBLISH_WEBRTC_ADDON: ${{ vars.O3D_PUBLISH_WEBRTC_ADDON == 'true' && 'true' || 'false' }}

jobs:
  build-release:
    runs-on: [ self-hosted, ue5, windows ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          submodules: 'recursive'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup UE
        shell: pwsh
        run: |
          & .\Build\Scripts\Setup-UE.ps1 -UEPath "${{ env.UE_ROOT }}"

      - name: Resolve plugin paths
        id: paths
        shell: powershell
        run: |
          $pluginDir = Join-Path $PWD "${{ env.PLUGIN_PATH }}"
          $upluginPath = Join-Path $pluginDir "${{ env.PLUGIN_NAME }}.uplugin"
          
          if (!(Test-Path -LiteralPath $pluginDir)) {
            throw "Plugin directory not found: $pluginDir"
          }
          if (!(Test-Path -LiteralPath $upluginPath)) {
            throw "Plugin .uplugin file not found: $upluginPath"
          }
          
          "plugin_dir=$pluginDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "uplugin_path=$upluginPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Plugin directory: $pluginDir"
          Write-Host "Plugin file: $upluginPath"

      - name: Determine version
        id: version
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version_tag }}"
          } else {
            $version = "${{ github.ref_name }}"
          }
          $normalized = $version -replace '^open3dbroadcast-v', ''
          "tag=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "number=$normalized" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version tag: $version"
          Write-Host "Version number: $normalized"

      - name: Verify required libraries
        shell: powershell
        run: |
          $pluginDir = "${{ steps.paths.outputs.plugin_dir }}"
          
          # The o3ds core is compiled from source (Open3DStreamCore, WP-F1), so
          # its mirror must be present; Opus and NNG are prebuilt libraries.
          $requiredLibs = @(
            @{ Path = "Source/ThirdParty/Open3DStreamCore/SYNC_STAMP.txt"; Name = "o3ds core mirror" },
            @{ Path = "Source/ThirdParty/opus/lib/Win64/opus.lib"; Name = "opus" },
            @{ Path = "Source/Open3DTransportNNG/ThirdParty/nng/lib/Win64/nng.lib"; Name = "nng" }
          )
          
          $missing = @()
          foreach ($lib in $requiredLibs) {
            $fullPath = Join-Path $pluginDir $lib.Path
            if (-not (Test-Path $fullPath)) {
              $missing += "$($lib.Name): $fullPath"
            } else {
              Write-Host "[OK] Found $($lib.Name): $fullPath"
            }
          }
          
          if ($missing.Count -gt 0) {
            Write-Error "Missing required third-party libraries:"
            $missing | ForEach-Object { Write-Error "  - $_" }
            exit 1
          }
          Write-Host "[OK] All required libraries present in plugin"

      - name: Update plugin descriptor version
        shell: powershell
        run: |
          $versionNumber = "${{ steps.version.outputs.number }}"
          # The WebRTC add-on carries the same version: it only works with the matching
          # Open3DBroadcast release (ADR 0002).
          $descriptors = @(
            "${{ steps.paths.outputs.uplugin_path }}",
            (Join-Path $PWD "${{ env.ADDON_PATH }}/${{ env.ADDON_NAME }}.uplugin")
          )
          foreach ($uplugin in $descriptors) {
            $content = Get-Content -Path $uplugin -Raw | ConvertFrom-Json
            $content.VersionName = $versionNumber
            if ($content.Version) {
              $content.Version = [int]$content.Version + 1
            }
            $content | ConvertTo-Json -Depth 10 | Set-Content -Path $uplugin -Encoding UTF8
            Write-Host "Updated $uplugin to version $versionNumber"
          }

      - name: Build Open3DBroadcast plugin (Win64, Shipping)
        shell: powershell
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP 'PluginPackage'
          & .\Build\Scripts\Build-Plugin.ps1 `
            -UEPath "$env:UE_ROOT" `
            -PluginUPluginPath "${{ steps.paths.outputs.uplugin_path }}" `
            -OutDir "$pkg" `
            -TargetPlatforms @("Win64") `
            -Configuration "Shipping"

      - name: Restructure package for archive
        id: restructure
        shell: powershell
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP 'PluginPackage'
          $restructured = Join-Path $env:RUNNER_TEMP 'PluginArchive'

          # The engine version comes from UE_ROOT; there is no fallback, so the
          # archive and notes cannot name a version the build did not use.
          $ueVersionMatch = [regex]::Match($env:UE_ROOT, 'UE_(\d+\.\d+)')
          if (-not $ueVersionMatch.Success) {
            throw "Cannot read the engine version from UE_ROOT '$env:UE_ROOT'."
          }
          $ueVersion = $ueVersionMatch.Groups[1].Value

          $targetPath = Join-Path $restructured "UE_$ueVersion/Plugins/Open3DBroadcast"
          New-Item -ItemType Directory -Force -Path $targetPath | Out-Null
          Copy-Item -Path "$pkg/*" -Destination $targetPath -Recurse -Force
          "archive_root=$restructured" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "ue_version=$ueVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create archive
        id: archive
        shell: powershell
        run: |
          $restructured = "${{ steps.restructure.outputs.archive_root }}"
          $archiveName = "Open3DBroadcast-Plugin-${{ steps.version.outputs.number }}-Win64.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          Compress-Archive -Path "$restructured/*" -DestinationPath $archivePath -CompressionLevel Optimal
          "path=$archivePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name=$archiveName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Created archive $archiveName"

      # WP-F11: the WebRTC add-on, built against the package above (editor binaries plus source;
      # a project that packages a game with it compiles the add-on's game module from source).
      - name: Build WebRTC add-on (Win64)
        shell: powershell
        run: |
          & .\Build\Scripts\Build-WebRTCAddOn.ps1 `
            -UEPath "$env:UE_ROOT" `
            -HostPluginPackageDir (Join-Path $env:RUNNER_TEMP 'PluginPackage') `
            -HostProjectDir (Join-Path $env:RUNNER_TEMP 'AddOnHost') `
            -OutDir (Join-Path $env:RUNNER_TEMP "AddOnArchive/UE_${{ steps.restructure.outputs.ue_version }}/Plugins/${{ env.ADDON_NAME }}")

      - name: Create WebRTC add-on archive
        id: addon_archive
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'AddOnArchive'
          $archiveName = "${{ env.ADDON_NAME }}-Plugin-${{ steps.version.outputs.number }}-Win64.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          Compress-Archive -Path "$root/*" -DestinationPath $archivePath -CompressionLevel Optimal
          "path=$archivePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name=$archiveName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Created archive $archiveName (attached to the release: $env:PUBLISH_WEBRTC_ADDON)"

      - name: Generate release notes
        id: notes
        shell: powershell
        run: |
          $notes = @"
          ## Open3DBroadcast ${{ steps.version.outputs.tag }}

          ### Installation

          1. Download the attached archive.
          2. Extract the `UE_${{ steps.restructure.outputs.ue_version }}/Plugins/Open3DBroadcast` folder.
          3. Copy the folder into your project's `Plugins` directory.
          4. Restart Unreal Editor and enable **Open3DBroadcast**.

          ### Compatibility

          - **Unreal Engine**: ${{ steps.restructure.outputs.ue_version }} only. The binaries are built for this engine version and do not load in other versions.
          - **Platform**: Windows (Win64) only.

          ### Contents

          - Open3DBroadcast plugin modules (Sender, Receiver, Shared, Transport implementations), compiled for Win64
          - Required Open3DStream core libraries and third-party dependencies

          This is the GitHub build. It is not the Fab package.

          ### WebRTC (LiveKit) transport

          WebRTC is a separate, free add-on plugin, Open3DBroadcastWebRTC, built for this release
          only. When it is attached to this release, extract its
          `UE_${{ steps.restructure.outputs.ue_version }}/Plugins/Open3DBroadcastWebRTC` folder into the
          same project's `Plugins` directory, next to Open3DBroadcast.
          "@
          $notes | Out-File -FilePath "$env:RUNNER_TEMP\release_notes.md" -Encoding UTF8

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Open3DBroadcast ${{ steps.version.outputs.number }}
          body_path: ${{ runner.temp }}/release_notes.md
          files: |
            ${{ steps.archive.outputs.path }}
            ${{ env.PUBLISH_WEBRTC_ADDON == 'true' && steps.addon_archive.outputs.path || '' }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: Open3DBroadcast-Release-${{ steps.version.outputs.number }}
          path: ${{ runner.temp }}/PluginPackage
          retention-days: 90

      - name: Upload WebRTC add-on artifact
        uses: actions/upload-artifact@v4
        with:
          name: Open3DBroadcastWebRTC-Release-${{ steps.version.outputs.number }}
          path: ${{ steps.addon_archive.outputs.path }}
          retention-days: 90
