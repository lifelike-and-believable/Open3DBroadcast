name: Open3DBroadcast Plugin Release

# A release of Open3DBroadcast from a tag open3dbroadcast-vX.Y.Z (WP-R2; mid-project review BC-4,
# BC-5; maintainer decision 2026-10-06). Details in Build/README.md, "Releases".
#   1. Release gate (GitHub-hosted, a minute): Build/Scripts/release-version.py takes X.Y.Z from
#      the tag and requires CHANGELOG.md's "## [X.Y.Z]" section, which names the protocol,
#      transport API and core versions the release carries. It then stamps VersionName X.Y.Z and
#      Version X*10000 + Y*100 + Z into both .uplugin files and uploads them for the next jobs.
#   2. Fab source zip and UE build and tests: the workflows PR CI runs
#      (open3dbroadcast-fab-package.yml, open3dbroadcast-ue-build-test.yml), on the stamped
#      files, once per supported engine (ADR 0014, WP-V5): build with warnings as errors, the
#      automation tests alone and with the WebRTC add-on (each at its floor), the strict build,
#      and BuildPlugin on that engine's Fab zip. Every engine runs the full job.
#   3. Publish (GitHub-hosted, tag pushes only, after 1 and 2 passed): the GitHub release, with one
#      zip per engine holding the package the tests ran against, as
#      UE_<engine>/Plugins/Open3DBroadcast, and the CHANGELOG section as notes. The WebRTC add-on
#      zips are attached only when the repository variable O3D_PUBLISH_WEBRTC_ADDON is 'true'
#      (WP-F11, ADR 0002: it waits on counsel question L1). The Fab zips (one per engine) are kept
#      as a 90-day run artifact, to upload to Fab by hand; they are not attached.
#
# Run by hand (Actions > Run workflow) for a dry run: every job but Publish, on the chosen
# branch, with a missing CHANGELOG section reported as a warning. A dry run cannot create a tag
# or a release.

on:
  push:
    tags:
      - "open3dbroadcast-v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Dry run: the version X.Y.Z to build and test as (nothing is published)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: open3dbroadcast-plugin-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version from the tag and the CHANGELOG section
        id: check
        env:
          TAG: ${{ github.ref_name }}
          DRY_RUN_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            python3 Build/Scripts/release-version.py check --tag "$TAG" \
              --notes-out "$RUNNER_TEMP/notes.md" --github-output "$GITHUB_OUTPUT"
          else
            python3 Build/Scripts/release-version.py check --version "$DRY_RUN_VERSION" --allow-missing-section \
              --notes-out "$RUNNER_TEMP/notes.md" --github-output "$GITHUB_OUTPUT"
          fi

      - name: Stamp the version into both .uplugin files
        run: |
          python3 Build/Scripts/release-version.py stamp --version "${{ steps.check.outputs.version }}" \
            ProjectSandbox/Plugins/Open3DBroadcast/Open3DBroadcast.uplugin \
            ProjectSandbox/Plugins/Open3DBroadcastWebRTC/Open3DBroadcastWebRTC.uplugin

      - name: Upload the stamped .uplugin files
        uses: actions/upload-artifact@v4
        with:
          name: Open3DBroadcast-Release-Descriptors-${{ github.sha }}
          path: |
            ProjectSandbox/Plugins/Open3DBroadcast/Open3DBroadcast.uplugin
            ProjectSandbox/Plugins/Open3DBroadcastWebRTC/Open3DBroadcastWebRTC.uplugin
          if-no-files-found: error
          retention-days: 7

      - name: Upload the release notes
        uses: actions/upload-artifact@v4
        with:
          name: Open3DBroadcast-Release-Notes-${{ github.sha }}
          path: ${{ runner.temp }}/notes.md
          if-no-files-found: error
          retention-days: 7

  # The engines a release supports (ADR 0014). The artifact suffixes match PR CI's, and Publish
  # checks it got a package for each engine in RELEASE_ENGINES.
  fab-package:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - ue-version: '5.7'
            artifact-suffix: ''
          - ue-version: '5.8'
            artifact-suffix: '-UE5.8'
    uses: ./.github/workflows/open3dbroadcast-fab-package.yml
    with:
      version: ${{ needs.gate.outputs.version }}
      uplugin-artifact: Open3DBroadcast-Release-Descriptors-${{ github.sha }}
      engine-version: ${{ matrix.ue-version }}
      artifact-suffix: ${{ matrix.artifact-suffix }}

  build-and-test:
    name: UE build and tests
    needs: [ gate, fab-package ]
    # Runs when the Fab zip failed too, so one run reports both; Publish needs both to pass.
    if: ${{ !cancelled() && needs.gate.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ue-version: '5.7'
            artifact-suffix: ''
          - ue-version: '5.8'
            artifact-suffix: '-UE5.8'
    uses: ./.github/workflows/open3dbroadcast-ue-build-test.yml
    with:
      fab-package-result: ${{ needs.fab-package.result }}
      version: ${{ needs.gate.outputs.version }}
      uplugin-artifact: Open3DBroadcast-Release-Descriptors-${{ github.sha }}
      ue-version: ${{ matrix.ue-version }}
      profile: full
      artifact-suffix: ${{ matrix.artifact-suffix }}

  publish:
    name: Publish the GitHub release
    needs: [ gate, fab-package, build-and-test ]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/open3dbroadcast-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      PUBLISH_WEBRTC_ADDON: ${{ vars.O3D_PUBLISH_WEBRTC_ADDON == 'true' && 'true' || 'false' }}
      # The engines of the build-and-test matrix, oldest first.
      RELEASE_ENGINES: '5.7 5.8'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A pattern download puts each artifact in a folder named after it, one per engine.
      - name: Download the tested plugin packages
        uses: actions/download-artifact@v4
        with:
          pattern: Open3DBroadcast-Win64-${{ github.sha }}*
          path: ${{ runner.temp }}/PluginPackages

      - name: Download the WebRTC add-ons
        uses: actions/download-artifact@v4
        with:
          pattern: Open3DBroadcastWebRTC-Win64-${{ github.sha }}*
          path: ${{ runner.temp }}/AddOnPackages

      - name: Download the Fab source zips
        uses: actions/download-artifact@v4
        with:
          pattern: Open3DBroadcast-Fab-Source-${{ github.sha }}*
          path: ${{ runner.temp }}/FabZip

      - name: Download the release notes
        uses: actions/download-artifact@v4
        with:
          name: Open3DBroadcast-Release-Notes-${{ github.sha }}
          path: ${{ runner.temp }}/Notes

      # One zip per engine for each plugin (ADR 0014). The script checks that every package carries
      # the release's version and that there is exactly one per engine.
      - name: Archives and notes
        run: |
          python3 Build/Scripts/release-version.py archives \
            --version "$VERSION" --engines "$RELEASE_ENGINES" --sha "$GITHUB_SHA" \
            --plugin-packages "$RUNNER_TEMP/PluginPackages" --addon-packages "$RUNNER_TEMP/AddOnPackages" \
            --notes "$RUNNER_TEMP/Notes/notes.md" --publish-addon "$PUBLISH_WEBRTC_ADDON" \
            --out-dir "$RUNNER_TEMP/Release"

      - name: Keep the release files
        uses: actions/upload-artifact@v4
        with:
          name: Open3DBroadcast-Release-${{ needs.gate.outputs.version }}
          path: |
            ${{ runner.temp }}/Release/*.zip
            ${{ runner.temp }}/FabZip/*/*
          if-no-files-found: error
          retention-days: 90

      - name: Create the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Open3DBroadcast ${{ needs.gate.outputs.version }}
          body_path: ${{ runner.temp }}/Release/release_notes.md
          files: |
            ${{ runner.temp }}/Release/Open3DBroadcast-Plugin-*.zip
            ${{ env.PUBLISH_WEBRTC_ADDON == 'true' && format('{0}/Release/Open3DBroadcastWebRTC-Plugin-*.zip', runner.temp) || '' }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
