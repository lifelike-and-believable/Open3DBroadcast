name: Open3DBroadcast Plugin CI

# Which jobs run when (CI-9; details in Build/README.md, "CI"):
#   - Every PR commit, drafts included: "Detect plugin-relevant changes",
#     "Fab source zip" and "Copyright headers" (GitHub-hosted, a minute or
#     two). core-tests.yml also runs on every PR.
#   - Non-draft PRs, pushes to develop/main and manual runs: "UE build and
#     tests" on the single self-hosted UE runner. Drafts skip it so work in
#     progress does not queue the runner; mark the PR ready for review, or
#     run this workflow by hand on the branch (Actions > Run workflow), to
#     get the UE result for a draft.
#   All jobs are skipped when a change touches nothing the plugin build
#   depends on (see the path filter below).

on:
  pull_request:
    branches: [ develop, main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  push:
    branches: [ develop, main ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: open3dbroadcast-plugin-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UE_ROOT: 'C:\\Program Files\\Epic Games\\UE_5.7'
  PLUGIN_NAME: 'Open3DBroadcast'
  PLUGIN_PATH: 'ProjectSandbox/Plugins/Open3DBroadcast'

jobs:
  changes:
    name: Detect plugin-relevant changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # The plugin compiles the o3ds core from source: Sync-O3DSCore.ps1
          # configures and builds the root CMakeLists.txt, which pulls in
          # src/, thirdparty/ (submodules), apps/ and plugins/mobu/. A change
          # to any of them can break the plugin build.
          filters: |
            code:
              - 'Build/**'
              - 'src/**'
              - 'thirdparty/**'
              - 'CMakeLists.txt'
              - '*.cmake'
              - 'apps/**'
              - 'plugins/mobu/**'
              - 'ProjectSandbox/ProjectSandbox.uproject'
              - 'ProjectSandbox/Source/**'
              - 'ProjectSandbox/Plugins/Open3DBroadcast/**'
              - '.gitmodules'
              - '.github/workflows/open3dbroadcast-plugin-ci.yml'
              - '.github/workflows/open3dbroadcast-fab-package.yml'

  fab-package:
    name: Fab source zip
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/open3dbroadcast-fab-package.yml

  # FAB-5 (WP-F4): every first-party .h/.cpp/.cs under the plugin's Source/
  # starts with the copyright header. A separate job, so a missing header
  # does not stop the Fab zip from being built and tested.
  copyright-headers:
    name: Copyright headers
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check copyright headers
        run: python3 Build/Scripts/check-copyright-headers.py

  build-and-test:
    name: UE build and tests
    needs: [ changes, fab-package ]
    # !cancelled() lets this job run when fab-package failed or was skipped;
    # the Fab steps below check its result themselves.
    if: >-
      !cancelled() && needs.changes.result == 'success' && (
        github.event_name == 'workflow_dispatch' ||
        (needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false))
      )
    runs-on: [ self-hosted, ue5, windows ]
    timeout-minutes: 90

    steps:
      - name: Checkout (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          submodules: 'recursive'

      - name: Post build started comment
        if: github.event_name == 'pull_request' && github.event.pull_request.number != null
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 **Open3DBroadcast Plugin CI build started** for this PR!\n\n[View build logs →](${runUrl})`
            });

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup UE
        shell: powershell
        run: |
          & .\Build\Scripts\Setup-UE.ps1 -UEPath "${{ env.UE_ROOT }}"

      - name: Ensure CMake
        shell: powershell
        run: |
          $cmake = Get-Command cmake -ErrorAction SilentlyContinue
          if ($cmake) {
            & $cmake.Source --version
            exit 0
          }

          $choco = Get-Command choco -ErrorAction SilentlyContinue
          if (-not $choco) {
            throw 'CMake is missing and Chocolatey is unavailable. Preinstall CMake on this self-hosted runner.'
          }

          & $choco.Source install cmake -y --installargs 'ADD_CMAKE_TO_PATH=System'
          if ($LASTEXITCODE -ne 0) {
            throw "Chocolatey failed to install CMake (exit code $LASTEXITCODE)."
          }

          $cmake = Get-Command cmake -ErrorAction SilentlyContinue
          if (-not $cmake) {
            throw 'CMake was installed but is not available on PATH. Restart the runner and retry.'
          }
          & $cmake.Source --version

      # Same toolchain windows.yml uses to build the o3ds release zip - see
      # that workflow's own comment on why -G "Visual Studio 17 2022" isn't
      # used here (no full VS IDE install for vswhere to find on this runner).
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Fix #203/#204: build o3ds from source instead of linking a
      # git-committed prebuilt open3dstreamstatic.lib. See
      # Build/Scripts/Sync-O3DSCore.ps1 for the full recipe.
      - name: Build o3ds core from source
        shell: powershell
        run: |
          & .\Build\Scripts\Sync-O3DSCore.ps1
        env:
          CC: cl
          CXX: cl

      - name: Resolve plugin paths
        id: paths
        shell: powershell
        run: |
          $pluginDir = Join-Path $PWD "${{ env.PLUGIN_PATH }}"
          $upluginPath = Join-Path $pluginDir "${{ env.PLUGIN_NAME }}.uplugin"

          if (!(Test-Path -LiteralPath $pluginDir)) {
            throw "Plugin directory not found: $pluginDir"
          }
          if (!(Test-Path -LiteralPath $upluginPath)) {
            throw "Plugin .uplugin file not found: $upluginPath"
          }

          "plugin_dir=$pluginDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "uplugin_path=$upluginPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Plugin directory: $pluginDir"
          Write-Host "Plugin file: $upluginPath"

      # The default BuildPlugin configuration (unity build, PCHs), which is
      # what Fab's build farm runs. Warnings in plugin sources fail it (CI-4).
      - name: Build Open3DBroadcast plugin (Win64)
        shell: powershell
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP 'PluginPackage'
          & .\Build\Scripts\Build-Plugin.ps1 `
            -UEPath "$env:UE_ROOT" `
            -PluginUPluginPath "${{ steps.paths.outputs.uplugin_path }}" `
            -OutDir "$pkg" `
            -TargetPlatforms @("Win64") `
            -Configuration "Development" `
            -FailOnWarnings

      - name: Package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Open3DBroadcast-Win64-${{ github.sha }}
          path: ${{ runner.temp }}/PluginPackage
          retention-days: 30

      # CI-2/CI-3: UE automation tests against the package built above, in a
      # throwaway host project (no ProjectSandbox compile, no stale
      # binaries). Filter is the plain prefix from ADR 0006; tests that need
      # the internet stay off (O3DB_NETWORK_TESTS=0).
      - name: Run UE automation tests
        id: tests
        timeout-minutes: 20
        shell: powershell
        env:
          O3DB_NETWORK_TESTS: '0'
        run: |
          & .\Build\Scripts\Run-AutomationTests.ps1 `
            -UEPath "$env:UE_ROOT" `
            -PluginPackageDir (Join-Path $env:RUNNER_TEMP 'PluginPackage') `
            -HostProjectDir (Join-Path $env:RUNNER_TEMP 'TestHost') `
            -ResultsDir "$PWD\Artifacts\AutomationTests" `
            -TestFilter "Open3DBroadcast"

      - name: Upload automation test report
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: Open3DBroadcast-AutomationTests-${{ github.sha }}
          path: Artifacts/AutomationTests
          if-no-files-found: ignore
          retention-days: 14

      # CI-4: one extra configuration that combines the strict checks:
      # BuildPlugin -StrictIncludes (no PCH, no unity build) with warnings in
      # plugin sources treated as errors. Its output is discarded.
      - name: Strict build (non-unity, no PCH, warnings as errors)
        shell: powershell
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP 'PluginPackageStrict'
          & .\Build\Scripts\Build-Plugin.ps1 `
            -UEPath "$env:UE_ROOT" `
            -PluginUPluginPath "${{ steps.paths.outputs.uplugin_path }}" `
            -OutDir "$pkg" `
            -TargetPlatforms @("Win64") `
            -Configuration "Development" `
            -StrictIncludes `
            -FailOnWarnings

      # CI-5: BuildPlugin on the contents of the Fab source zip made by the
      # fab-package job. See Build-FabZip.ps1 for the WP-F1 gap it reports.
      - name: Download Fab source zip
        if: needs.fab-package.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: Open3DBroadcast-Fab-Source-${{ github.sha }}
          path: ${{ runner.temp }}/FabZip

      - name: Build the Fab source zip
        if: needs.fab-package.result == 'success'
        shell: powershell
        run: |
          & .\Build\Scripts\Build-FabZip.ps1 `
            -UEPath "$env:UE_ROOT" `
            -Zip (Join-Path $env:RUNNER_TEMP 'FabZip') `
            -WorkDir (Join-Path $env:RUNNER_TEMP 'FabBuild') `
            -CoreSourcePluginDir "${{ steps.paths.outputs.plugin_dir }}"

      - name: Upload BuildPlugin logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Open3DBroadcast-BuildPluginLogs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/*-BuildPlugin.log
            ${{ runner.temp }}/FabBuild/*-BuildPlugin.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Post build completed comment
        if: github.event_name == 'pull_request' && github.event.pull_request.number != null && success()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ **Open3DBroadcast Plugin CI build completed successfully!**\n\n[View build logs →](${runUrl})\n\n📦 Plugin artifacts are available for download in the workflow run.`
            });

      - name: Post build failed comment
        if: github.event_name == 'pull_request' && github.event.pull_request.number != null && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ **Open3DBroadcast Plugin CI build failed.**\n\n[View build logs →](${runUrl})\n\nPlease check the logs for details.`
            });
