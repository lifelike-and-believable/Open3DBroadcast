name: Open3DBroadcast Plugin CI

# Which jobs run when (CI-9; details in Build/README.md, "CI"):
#   - Every PR commit, drafts included: "Detect plugin-relevant changes",
#     "Fab source zip", "Copyright headers" and "Runtime modules free of
#     editor code" (GitHub-hosted, a minute or two). core-tests.yml also
#     runs on every PR. "Markdown links resolve" runs on every PR and push,
#     whatever the change touches.
#   - Non-draft PRs, pushes to develop/main and manual runs: "UE build and
#     tests" on the single self-hosted UE runner. Drafts skip it so work in
#     progress does not queue the runner; mark the PR ready for review, or
#     run this workflow by hand on the branch (Actions > Run workflow), to
#     get the UE result for a draft. That job (steps in
#     open3dbroadcast-ue-build-test.yml, which the release reuses) builds Open3DBroadcast,
#     tests it alone, then builds the Open3DBroadcastWebRTC add-on against
#     that package and tests both plugins together (WP-F11).
#   All jobs are skipped when a change touches nothing the plugin build
#   depends on (see the path filter below).

on:
  pull_request:
    branches: [ develop, main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  push:
    branches: [ develop, main ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: open3dbroadcast-plugin-ci-${{ github.ref }}
  # Superseded PR runs are cancelled; pushes to develop are not, so every merge gets its own
  # post-merge run (WP-R2, BC-12: a docs merge used to cancel the previous code merge's run).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect plugin-relevant changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # The plugin build reads nothing outside the plugin folder (WP-F1):
          # the o3ds core is compiled from the mirror in
          # Source/ThirdParty/Open3DStreamCore. A change to src/o3ds reaches
          # the plugin only together with the re-synced mirror, which
          # core-tests.yml checks (sync_o3ds_core.py --check).
          # 'every': a file counts only if it matches both rules, so Markdown
          # in those folders (USER_GUIDE.md, README.md) does not start a UE
          # build. The Fab zip still carries it from the next code change.
          predicate-quantifier: 'every'
          filters: |
            code:
              - '{Build/**,ProjectSandbox/ProjectSandbox.uproject,ProjectSandbox/Source/**,ProjectSandbox/Plugins/Open3DBroadcast/**,ProjectSandbox/Plugins/Open3DBroadcastWebRTC/**,.github/workflows/open3dbroadcast-plugin-ci.yml,.github/workflows/open3dbroadcast-ue-build-test.yml,.github/workflows/open3dbroadcast-fab-package.yml}'
              - '!**/*.md'

  fab-package:
    name: Fab source zip
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/open3dbroadcast-fab-package.yml

  # FAB-5 (WP-F4): every first-party .h/.cpp/.cs under the plugin's Source/
  # starts with the copyright header. A separate job, so a missing header
  # does not stop the Fab zip from being built and tested.
  copyright-headers:
    name: Copyright headers
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check copyright headers
        run: python3 Build/Scripts/check-copyright-headers.py

  # WP-F7 (ADR 0010; FAB-7, SND-34, TRB-46): runtime modules name no editor-only or Slate module
  # in their Build.cs and include no editor-only header. Editor UI lives in Open3DBroadcastEditor.
  runtime-editor-deps:
    name: Runtime modules free of editor code
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Self-test the check
        run: python3 Build/Scripts/check-runtime-editor-deps.py --self-test
      - name: Check runtime modules
        run: python3 Build/Scripts/check-runtime-editor-deps.py
      # ADR 0012 item 3 (SHR-38): transports record into the runtime context their config names,
      # never into FO3DPerformanceMetrics::Get(). Same job: both are quick source scans.
      - name: Self-test the transport metrics check
        run: python3 Build/Scripts/check-transport-metrics.py --self-test
      - name: Check transports use their runtime context
        run: python3 Build/Scripts/check-transport-metrics.py

  # Issue #204: every tracked prebuilt binary under a ThirdParty/ folder has its SHA256 in the
  # library's README.md, so a replaced binary cannot go in without its provenance being updated.
  third-party-binaries:
    name: Third-party binaries match their READMEs
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Self-test the check
        run: python3 Build/Scripts/check-third-party-binaries.py --self-test
      - name: Check binary inventories
        run: python3 Build/Scripts/check-third-party-binaries.py
      # WP-R2 (BC-4, BC-5): the release gate's tag, CHANGELOG and .uplugin logic has no other
      # test before a release tag is pushed.
      - name: Self-test the release version script
        run: python3 Build/Scripts/release-version.py --self-test

  build-and-test:
    name: UE build and tests
    needs: [ changes, fab-package ]
    # !cancelled() lets this job run when fab-package failed or was skipped;
    # the Fab steps check its result themselves (passed in as fab-package-result).
    if: >-
      !cancelled() && needs.changes.result == 'success' && (
        github.event_name == 'workflow_dispatch' ||
        (needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false))
      )
    # The steps live in a reusable workflow so the release runs the same ones (WP-R2, BC-4).
    uses: ./.github/workflows/open3dbroadcast-ue-build-test.yml
    with:
      fab-package-result: ${{ needs.fab-package.result }}

  # WP-D4: relative links, links into this repository's own GitHub tree and #anchors in every
  # tracked Markdown file resolve. Not behind the path filter: it is for docs-only changes too.
  doc-links:
    name: Markdown links resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Self-test the check
        run: python3 Build/Scripts/check-markdown-links.py --self-test
      - name: Check Markdown links
        run: python3 Build/Scripts/check-markdown-links.py

  report:
    # Posts one comment on the PR when this workflow passed (jobs skipped by their `if:` count as
    # passed and are listed), so whoever watches the PR learns of a green run without polling.
    # A failure is reported by the failing job's check.
    name: Report success on the PR
    needs: [changes, fab-package, copyright-headers, runtime-editor-deps, third-party-binaries, doc-links, build-and-test]
    if: ${{ github.event_name == 'pull_request' && !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Post success comment
        uses: actions/github-script@v7
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS);
            const skipped = Object.entries(needs).filter(([, job]) => job.result === 'skipped').map(([name]) => name);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const head = context.payload.pull_request.head.sha.substring(0, 8);
            let body = `✅ **Open3DBroadcast Plugin CI build completed successfully!** (head ${head})\n\n[View logs →](${runUrl})`;
            if (needs['build-and-test'] && needs['build-and-test'].result === 'success') {
              body += `\n\n📦 Plugin artifacts are available for download in the workflow run.`;
            }
            if (skipped.length > 0) {
              body += `\n\nSkipped (counted as passed): ${skipped.join(', ')}`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  result:
    # The one check of this workflow to require on develop (WP-R2; mid-project review BC-2, BC-3).
    # It always runs and fails when any job of the plugin CI failed or was cancelled; a job skipped by its
    # `if:` counts as passed. Requiring only this check lets jobs inside the workflow be renamed
    # or split without touching branch protection, and a failure no other required check sees
    # (for example the Fab zip, whose result the UE job only reads) still blocks the merge.
    name: Plugin CI result
    needs: [changes, fab-package, copyright-headers, runtime-editor-deps, third-party-binaries, doc-links, build-and-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if a job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'to_entries | any(.value.result == "failure" or .value.result == "cancelled")' > /dev/null; then
            echo "::error::A job of this workflow failed or was cancelled; see the list above."
            exit 1
          fi
