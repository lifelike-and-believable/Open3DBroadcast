name: Build and publish Repeater image
# Disabled in the repository settings (manually); it pushes to GHCR on main and develop pushes and
# nightly when enabled. The smoke test below runs the image and checks that a message pushed into
# the relay reaches a subscriber (NNG's nngcat, built into the image), not only that it starts.
on:
  push:
    branches: [ main, develop ]
    paths:
      - "docker/Dockerfile.repeater"
      - ".dockerignore"
      - "apps/Repeater/**"
      - "src/**"
      - "CMakeLists.txt"
      - "thirdparty/nng"
      - "thirdparty/flatbuffers"
      - "thirdparty/crccpp"
      - ".github/workflows/repeater-image.yml"
  pull_request:
    branches: [ develop, main ]
    paths:
      - "docker/Dockerfile.repeater"
      - ".dockerignore"
      - "apps/Repeater/**"
      - "src/**"
      - "CMakeLists.txt"
      - "thirdparty/nng"
      - "thirdparty/flatbuffers"
      - "thirdparty/crccpp"
      - ".github/workflows/repeater-image.yml"
  schedule:
    - cron: '0 6 * * *' # daily 06:00 UTC nightly build
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/open3dstream-repeater
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR (for pushes and pulls)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build for PRs (no push), load to local Docker for smoke test
      - name: Build (PR)
        if: github.event_name == 'pull_request' && (github.event.pull_request.draft == false)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.repeater
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:pr-${{ github.sha }}

      - name: Smoke test (PR)
        if: github.event_name == 'pull_request' && (github.event.pull_request.draft == false)
        run: |
          set -e
          docker run -d --name o3ds-repeater --network host $IMAGE
          docker run -d --name o3ds-sub --network host --entrypoint /app/nngcat $IMAGE \
            --sub0 --dial tcp://127.0.0.1:7001 --subscribe "" --quoted --count 1 --recv-timeout 30
          # Pub/sub has a slow-joiner window, so push the same message a few times.
          docker run --rm --network host --entrypoint /app/nngcat $IMAGE \
            --push0 --dial tcp://127.0.0.1:7000 --data o3ds-repeater-smoke --count 10 --interval 1
          timeout 40 docker wait o3ds-sub
          docker logs o3ds-sub | tee sub.log
          docker logs o3ds-repeater
          docker stop o3ds-repeater o3ds-sub
          grep -q o3ds-repeater-smoke sub.log
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:pr-${{ github.sha }}

      # Build and push on main branch pushes
      - name: Build and push (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.repeater
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

      - name: Pull and smoke test (latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker pull $IMAGE
          set -e
          docker run -d --name o3ds-repeater --network host $IMAGE
          docker run -d --name o3ds-sub --network host --entrypoint /app/nngcat $IMAGE \
            --sub0 --dial tcp://127.0.0.1:7001 --subscribe "" --quoted --count 1 --recv-timeout 30
          # Pub/sub has a slow-joiner window, so push the same message a few times.
          docker run --rm --network host --entrypoint /app/nngcat $IMAGE \
            --push0 --dial tcp://127.0.0.1:7000 --data o3ds-repeater-smoke --count 10 --interval 1
          timeout 40 docker wait o3ds-sub
          docker logs o3ds-sub | tee sub.log
          docker logs o3ds-repeater
          docker stop o3ds-repeater o3ds-sub
          grep -q o3ds-repeater-smoke sub.log
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:latest

      # Develop branch push publishes an :edge tag for immediate testing
      - name: Build and push (develop)
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.repeater
          push: true
          tags: ${{ env.IMAGE_NAME }}:edge

      - name: Pull and smoke test (edge)
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          docker pull $IMAGE
          set -e
          docker run -d --name o3ds-repeater --network host $IMAGE
          docker run -d --name o3ds-sub --network host --entrypoint /app/nngcat $IMAGE \
            --sub0 --dial tcp://127.0.0.1:7001 --subscribe "" --quoted --count 1 --recv-timeout 30
          # Pub/sub has a slow-joiner window, so push the same message a few times.
          docker run --rm --network host --entrypoint /app/nngcat $IMAGE \
            --push0 --dial tcp://127.0.0.1:7000 --data o3ds-repeater-smoke --count 10 --interval 1
          timeout 40 docker wait o3ds-sub
          docker logs o3ds-sub | tee sub.log
          docker logs o3ds-repeater
          docker stop o3ds-repeater o3ds-sub
          grep -q o3ds-repeater-smoke sub.log
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:edge

      # Nightly scheduled build to 'nightly' tag
      - name: Build and push (nightly)
        if: github.event_name == 'schedule'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.repeater
          push: true
          tags: ${{ env.IMAGE_NAME }}:nightly

      - name: Pull and smoke test (nightly)
        if: github.event_name == 'schedule'
        run: |
          docker pull $IMAGE
          set -e
          docker run -d --name o3ds-repeater --network host $IMAGE
          docker run -d --name o3ds-sub --network host --entrypoint /app/nngcat $IMAGE \
            --sub0 --dial tcp://127.0.0.1:7001 --subscribe "" --quoted --count 1 --recv-timeout 30
          # Pub/sub has a slow-joiner window, so push the same message a few times.
          docker run --rm --network host --entrypoint /app/nngcat $IMAGE \
            --push0 --dial tcp://127.0.0.1:7000 --data o3ds-repeater-smoke --count 10 --interval 1
          timeout 40 docker wait o3ds-sub
          docker logs o3ds-sub | tee sub.log
          docker logs o3ds-repeater
          docker stop o3ds-repeater o3ds-sub
          grep -q o3ds-repeater-smoke sub.log
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:nightly

  report:
    # Posts one comment on the PR when this workflow passed (jobs skipped by their `if:` count as
    # passed and are listed), so whoever watches the PR learns of a green run without polling.
    # A failure is reported by the failing job's check.
    name: Report success on the PR
    needs: [build-and-push]
    if: ${{ github.event_name == 'pull_request' && !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Post success comment
        uses: actions/github-script@v7
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS);
            const skipped = Object.entries(needs).filter(([, job]) => job.result === 'skipped').map(([name]) => name);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const head = context.payload.pull_request.head.sha.substring(0, 8);
            let body = `✅ **Repeater image build completed successfully!** (head ${head})\n\n[View logs →](${runUrl})`;
            if (skipped.length > 0) {
              body += `\n\nSkipped (counted as passed): ${skipped.join(', ')}`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
