name: O3DS windows
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'  # Trigger the workflow on version tags
  workflow_dispatch:
    inputs:
      tag:
        description: 'Specify the tag for manual run'
        required: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - id: get_version
        uses: dhkatz/get-version-action@v3.0.0

      - name: Checkout code
        uses: actions/checkout@v2
        with:
          submodules: 'recursive'

      - name: mkdir usr
        run: |
          New-Item -ItemType Directory -Force -Path $env:GITHUB_WORKSPACE/usr | Out-Null

      - name: Perl
        uses: shogo82148/actions-setup-perl@v1.27.0
        with:
          perl-version: '5.32'

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip' # caching pip dependencies
      - run: pip install jsonschema jinja2         

      - name: CMake
        run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'

      - name: OpenSSL
        run: |
          choco install openssl -y --no-progress
          echo "OpenSSL installed successfully"
        shell: powershell

      # Puts cl.exe (and INCLUDE/LIB/LIBPATH) on PATH ahead of Strawberry Perl's
      # bundled MinGW gcc.exe, which CMake's default Ninja generator would
      # otherwise silently pick up - producing .a archives instead of
      # MSVC-compatible .lib files, incompatible with the UE plugin these are
      # vendored into. Must run after the Perl step so its PATH prepend wins.
      # Deliberately NOT using `-G "Visual Studio 17 2022"` below: that
      # generator requires vswhere to find a full Visual Studio IDE
      # installation, which windows-latest doesn't have (only via
      # msvc-dev-cmd's toolset). Ninja + cl.exe on PATH needs no such
      # discovery and is the standard combination for this.
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: NNG
        working-directory: thirdparty/nng
        run: |
          cmake -S . -B build -DNNG_ENABLE_TLS=Off -DCMAKE_INSTALL_PREFIX=%GITHUB_WORKSPACE%/usr -DCMAKE_PREFIX_PATH=%GITHUB_WORKSPACE%/usr
          cmake --build build --config Release && cmake --install build --config Release
        shell: cmd

      - name: CML
        working-directory: thirdparty/cml
        run: |
          cmake -S . -B build -DCMAKE_INSTALL_PREFIX=%GITHUB_WORKSPACE%/usr
          cmake --build build --config Release && cmake --install build --config Release
        shell: cmd

      - name: CRC
        working-directory: thirdparty/crccpp
        run: |
          cmake -S . -B build -DCMAKE_INSTALL_PREFIX=%GITHUB_WORKSPACE%/usr
          cmake --build build --config Release && cmake --install build --config Release
        shell: cmd

      - name: FlatBuffers
        working-directory: thirdparty/flatbuffers
        run: |
          cmake -S . -B build -DCMAKE_INSTALL_PREFIX=%GITHUB_WORKSPACE%/usr
          cmake --build build --config Release && cmake --install build --config Release
        shell: cmd

      - name: Open3DStream
        run: |
          cmake -S . -B _o3ds_build -DVERSION_TAG=${{ steps.get_version.outputs.version-without-v }} -DCMAKE_PREFIX_PATH=usr -DCMAKE_INSTALL_PREFIX=out -DO3DS_DISABLE_WEBRTC=ON
          cmake --build _o3ds_build --config Release && cmake --install _o3ds_build --config Release
        shell: cmd

      - name: Create Zip File for Release
        run: |
          cd out
          Compress-Archive -Path * -DestinationPath ../o3ds.zip
        shell: powershell
        
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.version-without-v }}-win
          release_name: Release ${{ github.ref }}-win
          draft: false
          prerelease: false       

      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: o3ds.zip
          asset_name: o3ds_${{ steps.get_version.outputs.version-without-v }}.zip
          asset_content_type: application/zip            
