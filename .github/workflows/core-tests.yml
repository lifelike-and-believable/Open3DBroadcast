name: Core library tests

# Builds and unit-tests the engine-agnostic core library (src/o3ds) on
# every PR/push, independent of the UE plugin build (which is gated on a
# self-hosted Windows runner and PR-draft state - see
# open3dbroadcast-plugin-ci.yml). This is the CI job the core-first
# section of docs/roadmap/resilient-streaming-and-motion-prediction.md
# depends on: as much of the roadmap's logic as possible lives in
# src/o3ds specifically so it can be verified here, on every PR, on
# GitHub-hosted runners, with no external dependencies beyond what's
# already vendored as submodules.

on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop, main ]
  workflow_dispatch:

concurrency:
  group: core-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (Linux, ASan/UBSan)
    runs-on: ubuntu-latest
    # Normal runs take about 3 minutes. The cap turns a hung step (seen on
    # apt-get) into a failure instead of a check that stays in progress.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init required submodules
        # Only what the core library + tests actually need. WebRTC/MoQ
        # dependencies (libdatachannel, mbedtls, moq-ffi, moq-rs) are not
        # initialized: this build uses -DO3DS_DISABLE_WEBRTC=ON. cml is
        # not used anywhere under src/o3ds.
        run: git submodule update --init thirdparty/flatbuffers thirdparty/crccpp thirdparty/nng

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build & install NNG
        working-directory: thirdparty/nng
        run: |
          cmake -B build -G Ninja -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/usr" \
            -DCMAKE_BUILD_TYPE=Release -DNNG_TESTS=OFF -DNNG_ENABLE_TLS=OFF
          cmake --build build
          cmake --install build

      - name: Build & install CRCpp
        working-directory: thirdparty/crccpp
        run: |
          cmake -B build -G Ninja -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/usr"
          cmake --build build
          cmake --install build

      - name: Build & install FlatBuffers
        working-directory: thirdparty/flatbuffers
        run: |
          # The vendored v2.0.6 pin hardcodes -Werror in its own CMakeLists.
          # On GCC 13+ (current ubuntu-latest), a handful of its own source
          # files trip newer stringop-overflow/-overread/array-bounds/restrict
          # static-analysis warnings unrelated to O3DS - disable those
          # specific checks (not just their error status: a later bare
          # -Werror in flatbuffers' own flags would otherwise re-escalate
          # anything merely downgraded via -Wno-error=). This only affects
          # how the vendored dependency itself is compiled.
          cmake -B build -G Ninja -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/usr" \
            -DCMAKE_BUILD_TYPE=Release -DFLATBUFFERS_BUILD_TESTS=OFF \
            -DCMAKE_CXX_FLAGS="-Wno-stringop-overflow -Wno-stringop-overread -Wno-array-bounds -Wno-restrict"
          cmake --build build
          cmake --install build

      - name: Configure core library + tests
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/usr" \
            -DO3DS_DISABLE_WEBRTC=ON \
            -DO3DS_BUILD_TESTS=ON \
            -DO3DS_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build

      # ADR 0003 (CORE-21): the committed src/o3ds_generated.h, which the UE
      # plugin compiles through its core mirror, must be what flatc from the
      # pinned thirdparty/flatbuffers makes of src/o3ds.fbs. The build above
      # has just regenerated it into build/src/_generated with that flatc.
      # Line endings are ignored (the committed file has CRLF).
      - name: Check src/o3ds_generated.h matches src/o3ds.fbs
        run: |
          if ! diff --strip-trailing-cr -q build/src/_generated/o3ds_generated.h src/o3ds_generated.h; then
            echo "::error file=src/o3ds_generated.h::src/o3ds_generated.h differs from what flatc (thirdparty/flatbuffers pin) generates from src/o3ds.fbs. Regenerate it with flatc --cpp -o src src/o3ds.fbs, then run python3 Build/Scripts/sync_o3ds_core.py."
            exit 1
          fi

      # Same check for the control channel schema (docs/adr/0011-control-channel.md).
      - name: Check src/o3ds_control_generated.h matches src/o3ds_control.fbs
        run: |
          if ! diff --strip-trailing-cr -q build/src/_generated/o3ds_control_generated.h src/o3ds_control_generated.h; then
            echo "::error file=src/o3ds_control_generated.h::src/o3ds_control_generated.h differs from what flatc (thirdparty/flatbuffers pin) generates from src/o3ds_control.fbs. Regenerate it with flatc --cpp -o src src/o3ds_control.fbs, then run python3 Build/Scripts/sync_o3ds_core.py."
            exit 1
          fi

      - name: Run tests (ctest, ASan/UBSan active)
        working-directory: build
        # -LE fuzz: the fallback fuzz runners have their own step below.
        run: ctest -LE fuzz --output-on-failure

      # D8 (docs/adr/0009-protocol-versioning.md item 11): frames from this
      # build's writer, read by the baseline reader (develop@7aea235, the
      # plan's baseline, built from a worktree with the same dependency pins).
      # Plain frames must still parse there; quantized and residual frames
      # (min_reader_version 2) must be rejected, never applied. The other
      # direction is core.wire_format_tests on test/fixtures/wire/v1.
      - name: Old-reader compatibility (baseline reader, this writer)
        env:
          BASELINE: 7aea2356ccb92c063340143c51dfec2e185568e5
        run: |
          git fetch --no-tags --depth=1 origin "$BASELINE"
          git worktree add --detach "$RUNNER_TEMP/baseline" "$BASELINE"
          cmake -S "$RUNNER_TEMP/baseline/src" -B "$RUNNER_TEMP/baseline-build" -G Ninja             -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/usr"             -DO3DS_DISABLE_WEBRTC=ON -DO3DS_VERSION_TAG=1.0.4
          cmake --build "$RUNNER_TEMP/baseline-build" --target open3dstreamstatic
          g++ -std=c++17 -O2 -DCRCPP_USE_NAMESPACE -DNNG_STATIC_LIB             -I"$RUNNER_TEMP/baseline/src" -I"$RUNNER_TEMP/baseline-build/_generated" -I"$RUNNER_TEMP/usr/include"             test/compat/compat_tool.cpp "$RUNNER_TEMP/baseline-build/libopen3dstreamstatic.a"             -L"$RUNNER_TEMP/usr/lib" -lnng -lpthread -o "$RUNNER_TEMP/compat_tool_baseline"
          mkdir -p "$RUNNER_TEMP/frames"
          build/test/o3ds_compat_tool write "$RUNNER_TEMP/frames"
          "$RUNNER_TEMP/compat_tool_baseline" read "$RUNNER_TEMP/frames" | tee "$RUNNER_TEMP/old-reader.txt"
          printf 'full ok
delta ok
quantized rejected: Invalid data structure
residual rejected: Invalid data structure
' > "$RUNNER_TEMP/expected.txt"
          if ! diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/old-reader.txt"; then
            echo "::error::The baseline reader did not read this writer's frames as ADR 0009 item 11 requires (plain frames parsed, quantized and residual rejected)."
            exit 1
          fi

      # WP-T1: deterministic fallback fuzz runners (test/fuzz,
      # fuzz_replay_main.cpp) - each fuzz target fed 20,000 fixed-seed
      # mutations of its seed corpus, under the same ASan/UBSan build.
      # A failing runner saves its input as
      # build/test/fuzz/o3ds-fuzz-crash-<target>.bin (uploaded below).
      - name: Run fallback fuzz runners (ctest -L fuzz)
        id: fuzz_fallback
        working-directory: build
        run: ctest -L fuzz --output-on-failure

      - name: Upload fallback fuzz crash inputs
        if: steps.fuzz_fallback.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-fallback-crashes
          path: build/test/fuzz/o3ds-fuzz-crash-*.bin
          if-no-files-found: ignore

      # C2 prerequisite (roadmap doc, Phase C2's "Float determinism" risk
      # note): runs the same deterministic synthetic-corpus/predictor-chain
      # probe built with MSVC in windows.yml, but compiled with GCC here.
      # Diff this step's output against that workflow's "Run Determinism
      # Probe" step output for the same commit to measure real cross-
      # compiler float drift before committing to a chained predictor for
      # residual coding. Not a pass/fail gate (no known-good baseline yet)
      # - just surfaces the numbers.
      - name: Run Determinism Probe (C2 prototype)
        run: build/apps/DeterminismProbe/DeterminismProbe

  plugin-core-mirror:
    # ADR 0003 (WP-F1): the Open3DBroadcast plugin compiles a generated copy of
    # the part of src/o3ds it uses (plus o3ds_generated.h, the FlatBuffers
    # runtime headers and CRC.h) from
    # ProjectSandbox/Plugins/Open3DBroadcast/Source/ThirdParty/Open3DStreamCore.
    # This fails when that copy, or the generated O3DSCore_*.cpp units, differ
    # from what Build/Scripts/sync_o3ds_core.py makes of src/ and the submodule
    # pins: a core change without a re-sync, or a hand edit of the copy.
    name: Plugin core mirror in sync
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init required submodules
        run: git submodule update --init thirdparty/flatbuffers thirdparty/crccpp

      - name: Check the mirror (sync_o3ds_core.py --check)
        run: python3 Build/Scripts/sync_o3ds_core.py --check

  fuzz:
    # WP-T1: coverage-guided libFuzzer run of every target in test/fuzz
    # (Parse, the update and residual paths, PeekMeta, UDP reassembly,
    # ReorderGate) for 60 s each, with ASan/UBSan. Pinned to ubuntu-24.04
    # so the clang-18 / libclang-rt-18-dev package names stay valid.
    name: Fuzz (Clang libFuzzer, 60 s per target)
    runs-on: ubuntu-24.04
    # About 8 minutes today (60 s per target plus the build); raise this
    # when targets are added.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init required submodules
        run: git submodule update --init thirdparty/flatbuffers thirdparty/crccpp thirdparty/nng

      - name: Install build tools
        # libclang-rt-18-dev carries the libFuzzer and sanitizer runtimes.
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18 libclang-rt-18-dev

      # Dependencies are built with the default compiler, exactly as in the
      # `test` job; only O3DS itself needs the fuzzing instrumentation.
      - name: Build & install NNG
        working-directory: thirdparty/nng
        run: |
          cmake -B build -G Ninja -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/usr" \
            -DCMAKE_BUILD_TYPE=Release -DNNG_TESTS=OFF -DNNG_ENABLE_TLS=OFF
          cmake --build build
          cmake --install build

      - name: Build & install CRCpp
        working-directory: thirdparty/crccpp
        run: |
          cmake -B build -G Ninja -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/usr"
          cmake --build build
          cmake --install build

      - name: Build & install FlatBuffers
        working-directory: thirdparty/flatbuffers
        run: |
          # See the same step in the `test` job for why these are disabled.
          cmake -B build -G Ninja -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/usr" \
            -DCMAKE_BUILD_TYPE=Release -DFLATBUFFERS_BUILD_TESTS=OFF \
            -DCMAKE_CXX_FLAGS="-Wno-stringop-overflow -Wno-stringop-overread -Wno-array-bounds -Wno-restrict"
          cmake --build build
          cmake --install build

      - name: Configure fuzz targets
        run: |
          cmake -B build-fuzz -G Ninja \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/usr" \
            -DO3DS_DISABLE_WEBRTC=ON \
            -DO3DS_BUILD_TESTS=OFF \
            -DO3DS_BUILD_FUZZERS=ON

      - name: Build fuzz targets and seed corpora
        run: |
          cmake --build build-fuzz
          cmake --build build-fuzz --target o3ds_fuzz_corpus

      - name: Run each fuzz target for 60 s
        shell: bash
        run: |
          mkdir -p fuzz-artifacts
          failed=""
          for target in parse parse_update residual peek_meta udp_reassembly reorder_gate; do
            echo "::group::o3ds_fuzz_$target"
            if ! build-fuzz/test/fuzz/o3ds_fuzz_$target "build-fuzz/test/fuzz/corpus/$target" \
                -max_total_time=60 -print_final_stats=1 \
                -artifact_prefix="fuzz-artifacts/$target-"; then
              failed="$failed $target"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::fuzz targets with findings:$failed (inputs are in the fuzz-crashes artifact)"
            exit 1
          fi

      - name: Upload fuzz crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: fuzz-artifacts/
          if-no-files-found: ignore

  warnings:
    # CORE-20 warning ratchet. -Wall -Wextra is on for O3DS's own code (the
    # core library minus the legacy connectors, the tests and the fuzz
    # targets; see o3ds_enable_warnings in CMakeLists.txt). This job counts
    # the unique warnings of a clean GCC build and fails if the count rises
    # above test/warning-baseline.txt; lower the baseline when warnings are
    # fixed. Pinned to ubuntu-24.04 so a runner-image GCC upgrade can't
    # move the count on its own.
    name: Warning ratchet (GCC -Wall -Wextra)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init required submodules
        run: git submodule update --init thirdparty/flatbuffers thirdparty/crccpp thirdparty/nng

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build & install NNG
        working-directory: thirdparty/nng
        run: |
          cmake -B build -G Ninja -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/usr" \
            -DCMAKE_BUILD_TYPE=Release -DNNG_TESTS=OFF -DNNG_ENABLE_TLS=OFF
          cmake --build build
          cmake --install build

      - name: Build & install CRCpp
        working-directory: thirdparty/crccpp
        run: |
          cmake -B build -G Ninja -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/usr"
          cmake --build build
          cmake --install build

      - name: Build & install FlatBuffers
        working-directory: thirdparty/flatbuffers
        run: |
          # See the same step in the `test` job for why these are disabled.
          cmake -B build -G Ninja -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/usr" \
            -DCMAKE_BUILD_TYPE=Release -DFLATBUFFERS_BUILD_TESTS=OFF \
            -DCMAKE_CXX_FLAGS="-Wno-stringop-overflow -Wno-stringop-overread -Wno-array-bounds -Wno-restrict"
          cmake --build build
          cmake --install build

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/usr" \
            -DO3DS_DISABLE_WEBRTC=ON \
            -DO3DS_BUILD_TESTS=ON

      - name: Build (clean, log captured)
        shell: bash
        run: cmake --build build 2>&1 | tee build-warnings.log

      - name: Check warning count against baseline
        shell: bash
        run: test/check_warning_baseline.sh build-warnings.log test/warning-baseline.txt "$GITHUB_WORKSPACE"

  msvc:
    # CORE-19: the plugin ships the core library built with MSVC in Release,
    # so the unit tests run in that configuration too, on every PR.
    # windows.yml also builds the core with MSVC (and now runs the tests
    # there as well), but only for release tags on the self-hosted UE
    # runner, so it can't be the PR gate.
    name: Build & test (Windows, MSVC Release)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init required submodules
        run: git submodule update --init thirdparty/flatbuffers thirdparty/crccpp thirdparty/nng

      # Puts cl.exe, INCLUDE/LIB and Visual Studio's bundled CMake and Ninja
      # on PATH. Every configure below also names cl explicitly, because
      # windows-latest has Strawberry Perl's MinGW gcc on PATH, which CMake
      # would otherwise pick (see the comment in windows.yml).
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build & install NNG
        working-directory: thirdparty/nng
        shell: cmd
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release -DNNG_TESTS=OFF -DNNG_ENABLE_TLS=OFF -DCMAKE_INSTALL_PREFIX=%RUNNER_TEMP%/usr || exit /b 1
          cmake --build build || exit /b 1
          cmake --install build || exit /b 1

      - name: Build & install CRCpp
        working-directory: thirdparty/crccpp
        shell: cmd
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=%RUNNER_TEMP%/usr || exit /b 1
          cmake --build build || exit /b 1
          cmake --install build || exit /b 1

      - name: Build & install FlatBuffers
        working-directory: thirdparty/flatbuffers
        shell: cmd
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release -DFLATBUFFERS_BUILD_TESTS=OFF -DCMAKE_INSTALL_PREFIX=%RUNNER_TEMP%/usr || exit /b 1
          cmake --build build || exit /b 1
          cmake --install build || exit /b 1

      - name: Configure core library + tests
        shell: cmd
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=%RUNNER_TEMP%/usr -DO3DS_DISABLE_WEBRTC=ON -DO3DS_BUILD_TESTS=ON

      - name: Build
        shell: cmd
        run: cmake --build build

      - name: Run unit tests (ctest, not the fuzz label)
        working-directory: build
        shell: cmd
        run: ctest -LE fuzz --output-on-failure
