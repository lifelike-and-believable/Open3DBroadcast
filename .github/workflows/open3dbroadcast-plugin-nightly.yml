name: Open3DBroadcast Plugin Nightly

on:
  schedule:
    - cron: "0 3 * * *"  # 3 AM UTC nightly
  workflow_dispatch:
    inputs:
      run_editor_tests:
        description: "Run Unreal automation tests"
        required: false
        default: true
        type: boolean
      run_flag_builds:
        description: "Build each O3D_WITH_TRANSPORT_* combination (four extra BuildPlugin runs)"
        required: false
        default: true
        type: boolean
      run_shipping_game:
        description: "Package ProjectSandbox as a Win64 Shipping game (WP-F7; a full cook)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  checks: write

concurrency:
  group: open3dbroadcast-plugin-nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  UE_ROOT: 'C:\\Program Files\\Epic Games\\UE_5.7'
  PLUGIN_NAME: 'Open3DBroadcast'
  PLUGIN_PATH: 'ProjectSandbox/Plugins/Open3DBroadcast'

jobs:
  fab-package:
    name: Fab source zip
    uses: ./.github/workflows/open3dbroadcast-fab-package.yml

  nightly-build:
    needs: fab-package
    # Run even if the Fab zip job failed; the Fab steps check its result.
    if: ${{ !cancelled() }}
    runs-on: [ self-hosted, ue5, windows ]
    # 120 minutes plus the flag-combination builds (WP-F2), the Shipping game package (WP-F7) and
    # the WebRTC add-on build and tests (WP-F11).
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          submodules: 'recursive'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Setup UE
        shell: pwsh
        run: |
          & .\Build\Scripts\Setup-UE.ps1 -UEPath "${{ env.UE_ROOT }}"

      - name: Resolve plugin paths
        id: paths
        shell: powershell
        run: |
          $pluginDir = Join-Path $PWD "${{ env.PLUGIN_PATH }}"
          $upluginPath = Join-Path $pluginDir "${{ env.PLUGIN_NAME }}.uplugin"
          
          if (!(Test-Path -LiteralPath $pluginDir)) {
            throw "Plugin directory not found: $pluginDir"
          }
          if (!(Test-Path -LiteralPath $upluginPath)) {
            throw "Plugin .uplugin file not found: $upluginPath"
          }
          
          "plugin_dir=$pluginDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "uplugin_path=$upluginPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Plugin directory: $pluginDir"
          Write-Host "Plugin file: $upluginPath"

      - name: Build Open3DBroadcast plugin (Win64)
        shell: powershell
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP 'PluginPackage'
          & .\Build\Scripts\Build-Plugin.ps1 `
            -UEPath "$env:UE_ROOT" `
            -PluginUPluginPath "${{ steps.paths.outputs.uplugin_path }}" `
            -OutDir "$pkg" `
            -TargetPlatforms @("Win64") `
            -Configuration "Shipping" `
            -FailOnWarnings

      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: Open3DBroadcast-Nightly-${{ github.sha }}
          path: ${{ runner.temp }}/PluginPackage
          retention-days: 21

      # CI-3: the tests load the binaries BuildPlugin produced above, in a
      # throwaway host project. They used to run in ProjectSandbox, which
      # the nightly never compiled, so they saw stale or missing binaries.
      # Schedule runs have no inputs, so the condition checks the event.
      # Network tests (ADR 0006) run when the endpoint secrets are set.
      - name: Run Unreal automation tests
        id: tests
        if: ${{ github.event_name == 'schedule' || inputs.run_editor_tests }}
        timeout-minutes: 30
        shell: powershell
        env:
          O3DB_NETWORK_TESTS: ${{ secrets.O3D_MOQ_RELAY_URL != '' && '1' || '0' }}
          O3D_MOQ_RELAY_URL: ${{ secrets.O3D_MOQ_RELAY_URL }}
          O3DB_LIVEKIT_URL: ${{ secrets.O3DB_LIVEKIT_URL }}
        run: |
          & .\Build\Scripts\Run-AutomationTests.ps1 `
            -UEPath "$env:UE_ROOT" `
            -PluginPackageDir (Join-Path $env:RUNNER_TEMP 'PluginPackage') `
            -HostProjectDir (Join-Path $env:RUNNER_TEMP 'TestHost') `
            -ResultsDir "$PWD\Artifacts\NightlyAutomation" `
            -TestFilter "Open3DBroadcast"

      - name: Upload automation artifacts
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: Open3DBroadcast-NightlyTests-${{ github.sha }}
          path: Artifacts/NightlyAutomation
          if-no-files-found: ignore
          retention-days: 21

      # WP-F11: the Open3DBroadcastWebRTC add-on built against tonight's package, and every test
      # again with both plugins enabled.
      - name: Build WebRTC add-on against the package
        id: addon
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.run_editor_tests) }}
        shell: powershell
        run: |
          & .\Build\Scripts\Build-WebRTCAddOn.ps1 `
            -UEPath "$env:UE_ROOT" `
            -HostPluginPackageDir (Join-Path $env:RUNNER_TEMP 'PluginPackage') `
            -HostProjectDir (Join-Path $env:RUNNER_TEMP 'AddOnHost') `
            -OutDir (Join-Path $env:RUNNER_TEMP 'AddOnPackage\Open3DBroadcastWebRTC') `
            -FailOnWarnings

      - name: Run Unreal automation tests with the WebRTC add-on
        id: addon-tests
        if: ${{ !cancelled() && steps.addon.outcome == 'success' }}
        timeout-minutes: 30
        shell: powershell
        env:
          O3DB_NETWORK_TESTS: ${{ secrets.O3D_MOQ_RELAY_URL != '' && '1' || '0' }}
          O3D_MOQ_RELAY_URL: ${{ secrets.O3D_MOQ_RELAY_URL }}
          O3DB_LIVEKIT_URL: ${{ secrets.O3DB_LIVEKIT_URL }}
        run: |
          & .\Build\Scripts\Run-AutomationTests.ps1 `
            -UEPath "$env:UE_ROOT" `
            -ProjectFile (Join-Path $env:RUNNER_TEMP 'AddOnHost\O3DWebRTCHost.uproject') `
            -ResultsDir "$PWD\Artifacts\NightlyAutomationWithAddOn" `
            -TestFilter "Open3DBroadcast"

      - name: Upload automation artifacts (with add-on)
        if: ${{ !cancelled() && steps.addon-tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: Open3DBroadcast-NightlyTestsWithAddOn-${{ github.sha }}
          path: Artifacts/NightlyAutomationWithAddOn
          if-no-files-found: ignore
          retention-days: 21

      # CI-4: the strict configuration also runs on pull requests; kept here
      # so a direct push that skipped PR CI is still covered overnight.
      - name: Strict build (non-unity, no PCH, warnings as errors)
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP 'PluginPackageStrict'
          & .\Build\Scripts\Build-Plugin.ps1 `
            -UEPath "$env:UE_ROOT" `
            -PluginUPluginPath "${{ steps.paths.outputs.uplugin_path }}" `
            -OutDir "$pkg" `
            -TargetPlatforms @("Win64") `
            -Configuration "Development" `
            -StrictIncludes `
            -FailOnWarnings

      # WP-F2 (TRB-24, TRF-27): the plugin must build with each transport switched off. One
      # BuildPlugin run per combination (see Build/Scripts/Build-FlagCombinations.ps1), strict
      # and with warnings as errors. Nightly only: each run takes as long as the PR build and
      # there is one UE runner.
      - name: Flag-combination builds
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.run_flag_builds) }}
        shell: powershell
        run: |
          & .\Build\Scripts\Build-FlagCombinations.ps1 `
            -UEPath "$env:UE_ROOT" `
            -PluginUPluginPath "${{ steps.paths.outputs.uplugin_path }}" `
            -OutRoot (Join-Path $env:RUNNER_TEMP 'FlagBuilds') `
            -Configuration "Development" `
            -StrictIncludes `
            -FailOnWarnings

      # WP-F2 acceptance: a Linux game target with the plugin enabled builds, and the plugin's
      # modules are left out. Needs the Linux cross-compile toolchain (LINUX_MULTIARCH_ROOT) on
      # the runner. Without it the check step shows as skipped, not passed (WP-R2, BC-9); with it,
      # -Require makes a missing toolchain a failure.
      - name: Linux toolchain present
        id: linux-toolchain
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          $present = -not [string]::IsNullOrWhiteSpace($env:LINUX_MULTIARCH_ROOT)
          "present=$($present.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if (-not $present) { Write-Host "::notice::LINUX_MULTIARCH_ROOT is not set on this runner; the Linux exclusion check is skipped." }

      - name: Linux target excludes the plugin
        if: ${{ !cancelled() && steps.linux-toolchain.outputs.present == 'true' }}
        shell: powershell
        run: |
          & .\Build\Scripts\Test-LinuxExclusion.ps1 -UEPath "$env:UE_ROOT" -Require

      # WP-F7 acceptance (ADR 0010): a packaged Win64 Shipping game with the plugin enabled builds,
      # with no Open3DBroadcast editor module in it. A full cook of ProjectSandbox, so nightly and
      # manual runs only, never pull requests (one shared UE runner).
      - name: Shipping game build
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.run_shipping_game) }}
        timeout-minutes: 60
        shell: powershell
        run: |
          & .\Build\Scripts\Build-ShippingGame.ps1 `
            -UEPath "$env:UE_ROOT" `
            -ArchiveDir (Join-Path $env:RUNNER_TEMP 'ShippingGame')

      - name: Download Fab source zip
        if: ${{ !cancelled() && needs.fab-package.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: Open3DBroadcast-Fab-Source-${{ github.sha }}
          path: ${{ runner.temp }}/FabZip

      - name: Build the Fab source zip
        if: ${{ !cancelled() && needs.fab-package.result == 'success' }}
        shell: powershell
        run: |
          & .\Build\Scripts\Build-FabZip.ps1 `
            -UEPath "$env:UE_ROOT" `
            -Zip (Join-Path $env:RUNNER_TEMP 'FabZip') `
            -WorkDir (Join-Path $env:RUNNER_TEMP 'FabBuild') `
            -RequireStandalone

      - name: Upload BuildPlugin logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Open3DBroadcast-NightlyBuildPluginLogs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/*-BuildPlugin.log
            ${{ runner.temp }}/FabBuild/*-BuildPlugin.log
            ${{ runner.temp }}/FlagBuilds/*-BuildPlugin.log
          if-no-files-found: ignore
          retention-days: 21

  notify:
    # WP-R2 (mid-project review BC-9): a red scheduled nightly opens an issue labelled
    # nightly-failure (or comments on the open one), so GitHub notifies the repository's watchers;
    # the next green scheduled nightly closes it. Manual runs never open or close the issue.
    name: Report the nightly result
    needs: [fab-package, nightly-build]
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the nightly-failure issue
        uses: actions/github-script@v7
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS);
            const failed = Object.entries(needs).filter(([, job]) => job.result === 'failure' || job.result === 'cancelled').map(([name, job]) => `${name}: ${job.result}`);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const label = 'nightly-failure';
            const { owner, repo } = context.repo;
            const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', labels: label, per_page: 100 });
            if (failed.length === 0) {
              for (const issue of open) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `The nightly passed again: ${runUrl}` });
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
              }
              core.info(`Nightly green; closed ${open.length} open ${label} issue(s).`);
              return;
            }
            const body = `❌ The nightly failed on ${context.sha.substring(0, 8)} (${new Date().toISOString().substring(0, 10)}).\n\n${failed.map((line) => `- ${line}`).join('\n')}\n\n[Run →](${runUrl})`;
            if (open.length > 0) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open[0].number, body });
              core.info(`Commented on #${open[0].number}.`);
              return;
            }
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              await github.rest.issues.createLabel({ owner, repo, name: label, color: 'b60205', description: 'The scheduled nightly build failed' });
            }
            const created = await github.rest.issues.create({ owner, repo, title: 'Nightly build failing', labels: [label], body });
            core.info(`Opened #${created.data.number}.`);
