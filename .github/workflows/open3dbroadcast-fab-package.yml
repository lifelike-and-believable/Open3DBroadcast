name: Open3DBroadcast Fab package

# Builds the Fab source-only zip of the plugin on a GitHub-hosted runner and
# checks what is in it (CI-5, ADR 0002). Cheap, so it runs on every PR,
# drafts included. Called by open3dbroadcast-plugin-ci.yml and the nightly;
# can also be run by hand.
#
# What it does:
#   1. Build/Scripts/fab-package.py stages the git-tracked plugin files,
#      removes the modules in Build/Fab/exclude-modules.txt and the files
#      matching Build/Fab/exclude-files.txt, writes the zip and checks it
#      (no excluded module, no WebRTC or livekit file anywhere in the plugin,
#      no pdb/py, no developer docs, no Binaries).
#   2. check-no-video-codecs.sh scans every binary in the staged package for
#      ffmpeg/OpenH264 (CI-8). WebRTC's livekit_ffi.dll is not in the plugin
#      (it ships in the Open3DBroadcastWebRTC add-on, WP-F11), so this is a
#      required gate.
#   3. The zip and its manifest are uploaded as
#      Open3DBroadcast-Fab-Source-<sha>.
#
# BuildPlugin on the zip's contents runs on the self-hosted UE runner, in the
# calling workflow ("Build the Fab source zip" step), because it needs UE.

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version X.Y.Z, or empty (CI). When set, uplugin-artifact replaces the .uplugin files first.'
        type: string
        default: ''
      uplugin-artifact:
        description: 'Artifact holding the .uplugin files the release gate stamped with version (WP-R2, BC-5).'
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fab-package:
    name: Fab source zip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the version-stamped .uplugin files
        if: inputs.version != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.uplugin-artifact }}
          path: ProjectSandbox/Plugins

      - name: Build and check the Fab source zip
        run: |
          # The source descriptor has no EngineVersion; the zip is stamped for one engine (ADR 0014).
          # UE 5.7 until the CI matrix (WP-V4) builds a zip per engine.
          python3 Build/Scripts/fab-package.py \
            --out-dir "$RUNNER_TEMP/fab" \
            --engine-version 5.7 \
            --zip-name "Open3DBroadcast-Fab-Source-${GITHUB_SHA::12}.zip"

      - name: Video codec gate on the packaged binaries
        run: |
          mapfile -t bins < "$RUNNER_TEMP/fab/binaries.txt"
          if [ "${#bins[@]}" -eq 0 ]; then
            echo "The package contains no .dll/.so/.dylib; nothing to scan."
            exit 0
          fi
          Build/Scripts/check-no-video-codecs.sh "${bins[@]}"

      # WP-F11: the whole Open3DBroadcast plugin tree, not only the Fab package,
      # is free of ffmpeg/OpenH264, because WebRTC lives in the add-on.
      - name: Video codec gate on the plugin tree
        run: Build/Scripts/check-no-video-codecs.sh

      - name: Upload Fab source zip
        uses: actions/upload-artifact@v4
        with:
          name: Open3DBroadcast-Fab-Source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/fab/*.zip
            ${{ runner.temp }}/fab/*.manifest.txt
          if-no-files-found: error
          retention-days: 30
