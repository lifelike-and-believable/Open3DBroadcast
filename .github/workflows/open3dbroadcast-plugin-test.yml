name: Open3DBroadcast Plugin Tests

# Manual build-and-test of any branch on the UE runner. PR CI
# (open3dbroadcast-plugin-ci.yml) already builds and tests every non-draft
# PR, so this no longer runs on push: a push to a feature branch with an open
# PR used to queue the single UE runner twice.
on:
  workflow_dispatch:
    inputs:
      run_editor_tests:
        description: "Run Unreal automation tests after packaging"
        required: false
        default: true
        type: boolean
      network_tests:
        description: "Also run tests that need the internet (O3DB_NETWORK_TESTS=1)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  checks: write

concurrency:
  group: open3dbroadcast-plugin-test-${{ github.ref }}
  cancel-in-progress: true

env:
  UE_ROOT: 'C:\\Program Files\\Epic Games\\UE_5.7'
  PLUGIN_NAME: 'Open3DBroadcast'
  PLUGIN_PATH: 'ProjectSandbox/Plugins/Open3DBroadcast'

jobs:
  build-test:
    runs-on: [ self-hosted, ue5, windows ]
    timeout-minutes: 90

    steps:
      - name: Checkout (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          submodules: 'recursive'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup UE
        shell: pwsh
        run: |
          & .\Build\Scripts\Setup-UE.ps1 -UEPath "${{ env.UE_ROOT }}"

      - name: Resolve plugin paths
        id: paths
        shell: powershell
        run: |
          $pluginDir = Join-Path $PWD "${{ env.PLUGIN_PATH }}"
          $upluginPath = Join-Path $pluginDir "${{ env.PLUGIN_NAME }}.uplugin"
          
          if (!(Test-Path -LiteralPath $pluginDir)) {
            throw "Plugin directory not found: $pluginDir"
          }
          if (!(Test-Path -LiteralPath $upluginPath)) {
            throw "Plugin .uplugin file not found: $upluginPath"
          }
          
          "plugin_dir=$pluginDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "uplugin_path=$upluginPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Plugin directory: $pluginDir"
          Write-Host "Plugin file: $upluginPath"

      - name: Build Open3DBroadcast plugin (Win64)
        shell: powershell
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP 'PluginPackage'
          & .\Build\Scripts\Build-Plugin.ps1 `
            -UEPath "$env:UE_ROOT" `
            -PluginUPluginPath "${{ steps.paths.outputs.uplugin_path }}" `
            -OutDir "$pkg" `
            -TargetPlatforms @("Win64") `
            -Configuration "Development"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: Open3DBroadcast-Test-${{ github.sha }}
          path: ${{ runner.temp }}/PluginPackage
          retention-days: 14

      # CI-2: inputs.run_editor_tests is a boolean. The old condition compared
      # it with the string 'true', which is always false, so tests never ran.
      - name: Run Unreal automation tests
        if: ${{ inputs.run_editor_tests }}
        timeout-minutes: 20
        shell: powershell
        env:
          O3DB_NETWORK_TESTS: ${{ inputs.network_tests && '1' || '0' }}
        run: |
          & .\Build\Scripts\Run-AutomationTests.ps1 `
            -UEPath "$env:UE_ROOT" `
            -PluginPackageDir (Join-Path $env:RUNNER_TEMP 'PluginPackage') `
            -HostProjectDir (Join-Path $env:RUNNER_TEMP 'TestHost') `
            -ResultsDir "$PWD\Artifacts\AutomationTests" `
            -TestFilter "Open3DBroadcast"

      - name: Upload automation test logs
        if: ${{ !cancelled() && inputs.run_editor_tests }}
        uses: actions/upload-artifact@v4
        with:
          name: Open3DBroadcast-AutomationLogs-${{ github.sha }}
          path: Artifacts/AutomationTests
          if-no-files-found: ignore
          retention-days: 14
