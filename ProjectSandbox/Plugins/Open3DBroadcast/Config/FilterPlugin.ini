[FilterPlugin]
; Files outside the standard plugin folders (Binaries, Config, Content, Resources, Shaders,
; Source) that RunUAT BuildPlugin copies into the plugin package (FAB-2, WP-F1). Paths are
; relative to the plugin root and may use "...", "*" and "?" wildcards.
;
; Everything the build needs, including third-party code, lives under Source/, so this list
; holds only the end-user documentation and licences. Build/Scripts/fab-package.py fails if the
; Fab zip has a top-level file or folder that is neither standard nor listed here.
/README.md
/USER_GUIDE.md
/Transport_Module_Comparison.md
/LICENSE
/THIRD_PARTY_LICENSES.md
