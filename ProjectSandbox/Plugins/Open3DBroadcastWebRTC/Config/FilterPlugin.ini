[FilterPlugin]
; Files outside the standard plugin folders (Binaries, Config, Content, Resources, Shaders,
; Source) that RunUAT BuildPlugin copies into the plugin package (FAB-2, WP-F1, WP-F11). Paths
; are relative to the plugin root and may use "...", "*" and "?" wildcards.
;
; Everything the build needs, including livekit_ffi, lives under Source/, so this list holds
; only the end-user documentation and licences.
/README.md
/USER_GUIDE.md
/LICENSE
/THIRD_PARTY_LICENSES.md
